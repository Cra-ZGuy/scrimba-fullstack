<!DOCTYPE html>
<html lang="en">

<head>
    <title>BlogSpace</title>
    <meta name="description" content="A space to write and read blogs/posts.">
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <nav>
        <h1>BlogSpace</h1>
    </nav>
    <main>
        <form id="create-post">
            <label id="post-title-label" for="post-title">Your title here...</label>
            <input id="post-title" class="post-input" type="text" name="title" placeholder="Your title here..."
                required>
            <label id="post-body-label" for="post-body">Write something...</label>
            <textarea id="post-body" class="post-input" name="body" rows="5" cols="30" placeholder="Write something..."
                maxlength="500"></textarea>
            <button id="post-btn" type="submit">Post</button>
        </form>
        <div id="post-list"></div>
    </main>
    <script src="index.js"></script>
</body>

</html>
